<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chains motion studio</title><base href="/">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#d9f0eb;color:#164549;font:14px system-ui}canvas{display:block;width:100%;height:78vh}nav{padding:14px;display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:8px;border:1px solid #89bfb7;background:#fff;border-radius:8px}output{padding:10px 14px;display:block}</style>
<canvas id="view"></canvas><nav><select id="action" aria-label="Throw"></select><select id="hand" aria-label="Throwing hand"><option>right</option><option>left</option></select><select id="speed" aria-label="Playback speed"><option value="1">Normal speed</option><option value=".25">Quarter speed</option></select><button id="restart">Restart</button><button id="pause">Pause</button><button id="turn">Turn</button><input id="phase" aria-label="Phase" type="range" min="0" max="1" step=".01" value="0"></nav><output id="info"></output>
<script type="module">
import * as THREE from 'three';import {createCharacter,DEFAULT_AVATAR} from '/src/player.js';import {loadManifest} from '/src/assets.js';import {loadModels} from '/src/models.js';import {THROWS} from '/src/physics.js';
const params=new URLSearchParams(location.search),quality=params.get('quality')||'high';const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight*.78,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9f0eb');const camera=new THREE.PerspectiveCamera(34,innerWidth/(innerHeight*.78),.1,40);camera.position.set(0,1.15,-3.5);camera.lookAt(0,.88,0);scene.add(new THREE.HemisphereLight('#ffffff','#a5c9b3',1.75));const sun=new THREE.DirectionalLight('#fff9df',1.8);sun.position.set(-3,5,-3);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(.62,.68,.06,48),new THREE.MeshToonMaterial({color:'#f5fcf8'}));floor.position.y=-.08;scene.add(floor);
await loadManifest();await loadModels(renderer,quality);const select=document.getElementById('action'),handSelect=document.getElementById('hand');for(const id of Object.keys(THROWS)){const o=document.createElement('option');o.textContent=id;select.append(o);}select.value=params.get('throw')||'backhand';handSelect.value=params.get('hand')||'right';let actor,time=0,paused=params.has('phase');const slider=document.getElementById('phase');let phase=Number(params.get('phase')||0);
function make(){if(actor){scene.remove(actor.group);actor.dispose();}actor=createCharacter({...DEFAULT_AVATAR,hand:handSelect.value,number:27});scene.add(actor.group);const disc=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.018,32),new THREE.MeshToonMaterial({color:'#fbc748'}));actor.hand.add(disc);disc.position.z=-.03;actor.disc=disc;actor.group.rotation.y=Number(params.get('yaw')||.35);window.motionQA.actor=actor;}
function sample(p){phase=p;actor.setThrow(select.value);actor.setPhase(p);actor.update(0);actor.disc.visible=p<.62;actor.group.updateMatrixWorld(true);renderer.render(scene,camera);slider.value=p;document.getElementById('info').textContent=`${actor.source} · ${handSelect.value} · ${select.value} · phase ${p.toFixed(2)}`;}
window.motionQA={ready:false,scene,camera,renderer,createCharacter,loadModels,DEFAULT_AVATAR,THROWS,sample,make,select,handSelect,freeze(){paused=true;}};make();sample(phase);window.motionQA.ready=true;
select.onchange=()=>{time=0;paused=false;};handSelect.onchange=()=>{make();time=0;};document.getElementById('restart').onclick=()=>{time=0;paused=false;};document.getElementById('pause').onclick=()=>paused=!paused;document.getElementById('turn').onclick=()=>actor.group.rotation.y+=Math.PI/2;slider.oninput=()=>{paused=true;sample(Number(slider.value));};let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){time+=dt*Number(document.getElementById('speed').value);sample(Math.min(1,(time%2)/1.15));}else renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
