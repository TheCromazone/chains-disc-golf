<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chains athlete review</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>body{margin:0;background:#182824;color:#e6f2e8;font:14px system-ui}canvas{display:block}nav{padding:16px;display:flex;gap:8px;flex-wrap:wrap}button,select{padding:8px 12px;border:1px solid #58776a;border-radius:6px;background:#263c33;color:inherit;font:inherit}output{display:block;padding:0 16px 16px;white-space:pre-wrap}</style></head><body>
<canvas id="view"></canvas><nav><select id="figure" aria-label="Athlete body"><option>male</option><option>female</option></select><select id="hand" aria-label="Throwing hand"><option>right</option><option>left</option></select><select id="detail" aria-label="Detail tier"><option value="false">Full</option><option value="true">Lite</option></select><select id="action" aria-label="Animation"></select><button id="play">Play / pause</button><button id="turn">Turn</button><label>Pose <input id="phase" type="range" min="0" max="1" step="0.01" value="0" aria-label="Animation pose"></label></nav><output id="info">Loading athletes…</output>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createCharacter, DEFAULT_AVATAR } from '/src/player.js';
import { loadManifest } from '/src/assets.js';
import { loadModels } from '/src/models.js';
const canvas=document.getElementById('view'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,Math.min(765,innerHeight*.85));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#53665e');
const camera=new THREE.PerspectiveCamera(32,innerWidth/Math.min(765,innerHeight*.85),.1,40);
const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=true;orbit.minDistance=.8;orbit.maxDistance=7;orbit.maxPolarAngle=Math.PI*.85;
addEventListener('resize',()=>{const h=Math.min(765,innerHeight*.85);renderer.setSize(innerWidth,h);camera.aspect=innerWidth/h;camera.updateProjectionMatrix();});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:'#566c5b',roughness:1}));floor.receiveShadow=true;scene.add(floor);
scene.add(new THREE.HemisphereLight('#d7e6ff','#5a6251',1.4));const sun=new THREE.DirectionalLight('#fff1e1',3);sun.position.set(-3,5,-4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.bottom=-3;sun.shadow.camera.right=sun.shadow.camera.top=3;scene.add(sun);
await loadManifest();await loadModels(renderer,'high');
let actor=null,avatar=null,time=0,running=false,yaw=0,current='idle';
const actions=['idle','hero','ready','backhand','backhand_io','backhand_oi','forehand','forehand_io','forehand_oi','tomahawk','scoober','hammer','blade','putt','practice','celebrate','slump','walk'];
const select=document.getElementById('action');for(const id of actions)select.add(new Option(id,id));
function view(angle=0,close=false){yaw=angle;const radius=close?1.65:3.8,y=close?1.6:1.02;camera.position.set(Math.sin(yaw)*radius,y,-Math.cos(yaw)*radius);orbit.target.set(0,close?1.55:.9,0);orbit.update();}
function configure(value={}){if(actor){scene.remove(actor.group);actor.dispose();}avatar={...DEFAULT_AVATAR,...value};actor=createCharacter(avatar);actor.setGround?.(()=>0);scene.add(actor.group);time=0;current='idle';running=false;select.value='idle';view(0);return actor.source;}
function pose(name,at){running=false;current=name;actor.setPhase(null);actor.lookAt?.(null);
 if(name==='ready'||name==='hero'){for(let i=0;i<20;i++){if(name==='hero')actor.carry();else{actor.faceDir(0,-1);actor.releaseFrame('backhand');}actor.update(.05);}}
 else if(['idle','practice','walk'].includes(name)){actor.play?.(name);actor.update(at);}
 else if(['celebrate','slump'].includes(name)){actor.react(name);actor.update(at);}
 else{actor.setThrow(name);actor.setPhase(at);actor.update(0);}
 actor.group.rotation.y=0;render();}
function render(){renderer.render(scene,camera);}
function telemetry(){const meshes=[];actor.group.updateMatrixWorld(true);let finite=true,stretchedEdges=0,maxEdgeRatio=0;
 actor.group.traverse(o=>{if(!o.isSkinnedMesh)return;o.skeleton.update();const p=o.geometry.attributes.position,idx=o.geometry.index,vertices=[];
  for(let i=0;i<p.count;i++){const v=o.getVertexPosition(i,new THREE.Vector3());finite&&=Number.isFinite(v.x+v.y+v.z);vertices.push(v);}
  for(let i=0;i<idx.count;i+=3)for(let k=0;k<3;k++){const a=idx.getX(i+k),b=idx.getX(i+(k+1)%3),rest=new THREE.Vector3().fromBufferAttribute(p,a).distanceTo(new THREE.Vector3().fromBufferAttribute(p,b)),posed=vertices[a].distanceTo(vertices[b]);const ratio=posed/Math.max(rest,.001);maxEdgeRatio=Math.max(maxEdgeRatio,ratio);if(posed>.25&&ratio>10)stretchedEdges++;}
  meshes.push({name:o.name,vertices:p.count});
 });return{figure:avatar.figure,lod:!!avatar.lod,source:actor.source,finite,stretchedEdges,maxEdgeRatio,canvasCount:document.querySelectorAll('canvas').length,meshes};}
configure();window.characterQA={get actor(){return actor;},configure,pose,view,render,telemetry,ready:true};
for(const id of ['figure','hand','detail'])document.getElementById(id).onchange=()=>{configure({figure:document.getElementById('figure').value,hand:document.getElementById('hand').value,lod:document.getElementById('detail').value==='true'});};
select.onchange=()=>{current=select.value;pose(current,0);running=true;time=0;};document.getElementById('play').onclick=()=>{running=!running;};document.getElementById('turn').onclick=()=>view(yaw+Math.PI/2);
const phaseInput=document.getElementById('phase');phaseInput.oninput=()=>{const duration=current==='idle'?4:current==='walk'?1:['practice','celebrate','slump'].includes(current)?2.4:1;pose(current,+phaseInput.value*duration);};
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running){time+=dt;if(['hero','ready'].includes(current)){current==='hero'?actor.carry():(actor.faceDir(0,-1),actor.releaseFrame('backhand'));}else if(!['idle','practice','walk','celebrate','slump'].includes(current)){actor.setPhase(Math.min(1,(time%2.5)/1.6));}actor.update(dt);}
 orbit.update();render();const info=document.getElementById('info');if(info)info.textContent=`${avatar.figure} · ${avatar.hand} hand · ${avatar.lod?'Lite':'Full'} · ${current} · drag to orbit, scroll to zoom`;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
